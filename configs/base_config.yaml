# 主配置只保留运行选择和会改变研究口径的参数；省略项使用 src.config 中的默认值。
# 运行命令：python -m src.cli --config configs/base_config.yaml

# 选择本次运行阶段；CLI 不提供阶段覆盖参数。
run:
  # 计算 Factor YAML 目录中的全部因子。
  factors: true
  # 计算分组收益、IC 和 RankIC。
  group_return: true
  # 运行归一化净值回测。
  simple_backtest: true
  # 运行带现金账户的回测。
  account_backtest: true
  # 根据本次生成或已有结果绘图。
  plotter: true
  # 最大并发工作线程数
  max_workers: 4
  # true 从原始 CSV 重建市场缓存；false 优先复用已有 Parquet。
  refresh_market_data: false


factors:
  # Factor YAML 目录；相对路径以本主配置文件所在目录为基准。
  config_directory: ../examples/config/base_factors

output:
  # 每个因子的结果和图像写入该目录下的同名子目录。
  root: ../outputs

# 日频市场面板的数据范围、缓存位置和来源。
market_data:
  # 示例使用仓库内置 synthetic 数据；生产运行时替换为真实数据根目录。
  source_root: ../examples/data
  # 市场面板缓存写入该目录下以主配置文件名命名的子目录。
  cache_root: ../data
  # 数据范围需要覆盖因子预热期、评价期和回测期。
  start_date: "2024-01-02"
  end_date: "2024-06-28"
  # 定义交易日历和回测基准，且必须包含在 index_price.codes 中。
  benchmark_index: 000906.SH
  # 市场面板需要保存的历史指数成员集合。
  universe_indices:
    - 000906.SH
    - 000852.SH
  sources:
    index_price:
      codes:
        - 000906.SH
      fields:
        - S_DQ_CLOSE
    stock_quote:
      fields:
        - S_DQ_ADJCLOSE

# 默认按因子值等权十分组，每周五评价交易日和自然周未来收益。
group_return:
  start: "2024-02-02"
  end: "2024-06-07"
  universe_indices:
    - 000906.SH
    - 000852.SH
  sampling:
    # 休市时默认回退到前一交易日；anchor_date 固定自然周序列。
    weekday: FRI
    every_n_weeks: 1
    anchor_date: "2024-01-05"
    holiday_policy: previous_trading_day
  future_return_days:
    - 1
  future_return_weeks:
    - 1
    - 2
    - 4

# 默认按因子值等权十分组，成交限制使用 ideal，初始建仓收费且期末不清仓。
simple_backtest:
  start: "2024-02-02"
  end: "2024-06-21"
  universe_indices:
    - 000906.SH
    - 000852.SH
  # daily 的 intervals 单位为交易日；weekly 时单位为自然周。
  rebalance:
    frequency: weekly
    intervals:
      - 1
      - 2
      - 4
    weekday: FRI
    anchor_date: "2024-02-02"
    holiday_policy: previous_trading_day
  # 调仓日使用当日因子和复权收盘价，单边交易费率为 0。
  factor_lag_days: 0
  trade_price: close
  transaction_cost_rate: 0.0
# 带现金账户的回测
account_backtest:
  start: "2024-02-02"
  end: "2024-06-21"
  universe_indices:
    - 000906.SH
    - 000852.SH
  rebalance:
    frequency: weekly
    intervals:
      - 1
      - 2
      - 4
    weekday: FRI
    anchor_date: "2024-02-02"
    holiday_policy: previous_trading_day
  factor_lag_days: 0
  trade_price: close
  transaction_cost_rate: 0.0
