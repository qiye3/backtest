# 国证成长100编制思路示例：Factor 负责综合评分，PortfolioRule 负责目标权重。
run:
  factors: true
  group_return: false
  simple_backtest: false
  account_backtest: false
  strategies: true
  strategy_simple_backtest: true
  strategy_account_backtest: true
  plotter: true
  overall_evaluation: false
  max_workers: 4
  refresh_market_data: false

factors:
  # 专属目录只加载成长100综合评分，避免同时计算普通 Factor 示例。
  config_directory: ../examples/config/growth100_factors

strategies:
  config_directory: ../examples/config/strategies
  start: "2024-02-01"
  end: "2026-09-09"

output:
  root: ../outputs_growth100
  save_parquet:
    factor: true
    group_return: false
    simple_backtest: false
    account_backtest: false
    strategy_weights: true
    strategy_simple_backtest: false
    strategy_account_backtest: false
  save_backtest_details: false

market_data:
  source_root: /path/to/server/data
  cache_root: ../data/wind_formal
  start_date: "2022-01-04"
  end_date: "2026-09-09"
  benchmark_index: 000906.SH
  universe_indices:
    - 000906.SH
    - 000852.SH
  sources:
    index_price:
      codes:
        - 000906.SH
      fields:
        - S_DQ_CLOSE
    index_weights_monthly:
      codes:
        - 000906.SH
      fields:
        - I_WEIGHT
    stock_quote:
      fields:
        - S_DQ_CLOSE
        - S_DQ_ADJCLOSE
        - S_DQ_AMOUNT
    stock_valuation:
      fields:
        - S_VAL_MV
    stock_basic:
      fields:
        - LISTDATE
    financial_income:
      fields:
        - NET_PROFIT_EXCL_MIN_INT_INC
    financial_indicators:
      fields:
        - S_QFA_ROE
        - S_QFA_GROSSPROFITMARGIN
        - S_QFA_YOYNETPROFIT
    consensus_suntime:
      forecast_year_offsets:
        - 0
        - 1
      fields:
        - con_npgrate_13w
        - con_npcgrate_2y
        - con_roe
    free_float:
      fields:
        - S_SHARE_FREESHARES

simple_backtest:
  start: "2024-02-01"
  end: "2026-09-09"
  universe_indices:
    - 000906.SH
    - 000852.SH
  rebalance:
    frequency: quarterly
    intervals: [1]
    months: [2, 5, 8, 11]
    trading_day: 6
  trade_price: close
  benchmark:
    source: index_price
  initial_entry: first_rebalance
  initial_capital: 1.0
  transaction_cost_rate: 0.001
  charge_initial_cost: true
  liquidate_at_end: false
  empty_group_policy: cash
  insufficient_stocks_policy: error
  missing_price_policy: previous_close
  max_stale_days: null
  curve_frequency: both
  execution:
    policy: ideal

account_backtest:
  start: "2024-02-01"
  end: "2026-09-09"
  universe_indices:
    - 000906.SH
    - 000852.SH
  rebalance:
    frequency: quarterly
    intervals: [1]
    months: [2, 5, 8, 11]
    trading_day: 6
  trade_price: close
  benchmark:
    source: index_price
  initial_entry: first_rebalance
  initial_capital: 1000000
  transaction_cost_rate: 0.001
  charge_initial_cost: true
  liquidate_at_end: false
  empty_group_policy: cash
  insufficient_stocks_policy: error
  missing_price_policy: previous_close
  max_stale_days: null
  curve_frequency: both
  execution:
    policy: ideal

metrics:
  risk_free_rate: 0.0
  return_frequency: daily
  annual_trading_days: 252
  annual_weeks: 52
  include_initial_turnover: true
  simple_annual_return: linear
  account_annual_return: compound

plots:
  # 本示例只运行指数增强回测；保留信号分布图和策略专用图。
  evaluation:
    enabled: false
  simple:
    enabled: false
  account:
    enabled: false
