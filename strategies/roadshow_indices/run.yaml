# 一次运行成长100与路演“指数编制方案”的六套策略。
# python -m src.cli --config strategies/roadshow_indices/run.yaml
run:
  factors: true
  group_return: false
  strategies: true
  plotter: true
  overall_evaluation: false
  max_workers: 4
  refresh_market_data: false

factors:
  config_directory: factor_configs

strategies:
  config_directory: strategy_configs
  start: "2024-02-01"
  end: "2026-09-09"

strategy_analysis:
  enabled: false
  minimum_style_coverage: 0.95

output:
  root: ../../outputs_roadshow_indices
  save_parquet:
    factor: true
    group_return: false
    strategy_weights: true

market_data:
  source_root: /path/to/server/data
  cache_root: ../../data/wind_formal
  start_date: "2021-01-04"
  end_date: "2026-09-09"
  benchmark_index: 000906.SH
  universe_indices: [000906.SH, 000852.SH]
  sources:
    index_price:
      codes: [000906.SH]
      fields: [S_DQ_CLOSE]
    stock_quote:
      fields: [S_DQ_CLOSE, S_DQ_ADJCLOSE, S_DQ_AMOUNT]
    stock_valuation:
      fields:
        - S_VAL_MV
        - S_VAL_PB_NEW
        - S_VAL_PE_TTM
        - S_PRICE_DIV_DPS
        - FREE_SHARES_TODAY
    stock_basic:
      fields: [LISTDATE]
    financial_income:
      fields:
        - NET_PROFIT_EXCL_MIN_INT_INC
        - OPER_PROFIT
        - TOT_OPER_REV
        - RD_EXPENSE
    financial_balance_sheet:
      fields: [TOT_ASSETS, TOT_LIAB]
    financial_cashflow:
      fields: [NET_CASH_FLOWS_OPER_ACT]
    financial_indicators:
      fields:
        - S_FA_ROE
        - S_QFA_ROE
        - S_QFA_YOYNETPROFIT
        - S_FA_YOY_OR
        - S_FA_FCFF
        - S_FA_NETDEBT
        - S_FA_OCFTOPROFIT
    industry_history:
      fields: [ind_class_code]
      filters:
        industry_class_code: CITICS
    consensus_suntime:
      forecast_year_offsets: [0, 1]
      fields:
        - con_npgrate_13w
        - con_npcgrate_2y
        - con_roe

plots:
  distribution:
    enabled: false
  evaluation:
    enabled: false
