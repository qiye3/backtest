# v5 完整示例。相对路径均相对本 YAML 所在目录。
# 三个计算模块的 grouping / 区间 / 周期各自独立，互不继承；未知字段会立即报错。
# 未来收益按交易日计数；采样与调仓按锚定自然周；因子平滑只在 factors/*.yaml 中定义。
# close + factor_lag_days: 0 + execution.policy: ideal 表示同日收盘理想成交。
# transaction_cost_rate: 0.001 表示买入、卖出各按实际成交金额收取千分之一。
# 校验与默认值见 src/config.py；字段说明见 docs/config_reference.md。

# 实验输出子目录名，写入 output.root / experiment.name / factor_id。
# 仅允许字母、数字、下划线、连字符。更换同名因子文件后可用新 name 避免混用旧摘要。
experiment:
  name: single_factor_v5  # 默认 single_factor_v5

# 本次实际运行的模块。未选中的模块不要求完整配置。
# 可选（可多选、去重后按固定顺序执行）：factors / group_return / simple_backtest / account_backtest / plotting
# 实现：src/pipeline.py；CLI 也可覆盖。默认（未写 run 时）不含 factors。
run:
  modules:
  - factors
  - group_return
  - simple_backtest
  - account_backtest
  - plotting

# 原始市场数据。实现：src/data/market.py、src/data/calendar.py、src/data/prices.py
data:
  root: ../data  # 原始数据根目录；默认 ../data
  calendar_path: null  # 可选交易日历 CSV（date 列：完整、升序、无重复）。null 则用所读行情日期并集
  benchmark: 000906.SH  # 两种回测对比基准指数代码；group_return 评估不需要基准。默认 000906.SH
  benchmark_return: total_return  # 基准收益来源：total_return 读 index/prices_total_return；price 读 index/prices

# 标准因子生成。仅 run.modules 含 factors 时必填。实现：src/factors/builder.py、registry.py
# 各 Factor YAML 的公式、窗口、平滑见 docs/factor_catalog.md；平滑不算本文件参数。
factors:
  start: '2019-01-01'  # 生成矩阵的正式区间起点（含）；与三个计算模块区间独立
  end: '2021-12-31'  # 正式区间终点（含）
  universe_indices:  # 加载历史指数成员并集，覆盖生成所需股票；不可空
  - 000906.SH
  - 000852.SH
  values_dir: ../outputs/factor_values  # 写出因子矩阵、manifest、resolved_config；下游 generated 输入应指向同一目录
  configs:  # 单个 Factor YAML 路径列表（相对本文件）。name 不可重复
  - factors/consensus_13w_revision.yaml
  - factors/consensus_13w_revision_change_20d.yaml
  - factors/consensus_13w_revision_change_5d.yaml
  - factors/consensus_13w_revision_zscore.yaml
  - factors/growth_np_sue.yaml
  - factors/residual_momentum.yaml
  - factors/residual_momentum_change_20d.yaml
  - factors/residual_momentum_change_5d.yaml
  - factors/residual_momentum_quantile.yaml
  - factors/residual_momentum_zscore.yaml
  - factors/roe_history_zscore.yaml
  - factors/roe_level.yaml
  - factors/roe_qoq_diff.yaml
  - factors/roe_yoy_diff.yaml

# 评估/回测读取的因子输入。仅当运行 group_return / simple_backtest / account_backtest 时校验。
# 实现：src/data/factor_input.py。generated 会核对 manifest 内容摘要，下游不重跑 Factor。
factor_input:
  source: generated  # generated：读标准 Factor 目录；external：读 files 列表
  values_dir: ../outputs/factor_values  # generated 时的输入目录，需与生成位置一致
  ids:  # 从已选来源中再筛完整标识 name.variant（如 roe_level.smooth_1d）。空列表=全部；须唯一
  - roe_level.smooth_1d
  - consensus_13w_revision.smooth_1d
  files: []  # external 必填：[{id, path}, ...]。每个文件一个因子，id 不可重复。generated 时置 []
  layout: wide  # 目前仅 wide：日期×股票宽表。支持 .csv / .csv.gz / .parquet
  date_column: date  # 日期列名；Parquet 也可保留日期索引。日期 YYYY-MM-DD 或 YYYYMMDD，日级、无时区
  alignment: exact  # exact：所选日期必须存在因子截面；asof：用该日及之前最近一张完整快照（显式 NaN 不逐股填补）

# 多因子并行。绘图在 thread 后端有互斥锁。实现：src/pipeline.py
parallel:
  enabled: true  # 是否并行跑多个因子
  backend: process  # process / thread
  workers: 4  # 并行因子数（正整数）。同一因子的周期与区间在该任务内依次执行
  on_error: continue  # continue：单因子失败后继续提交其余任务；stop：停止提交。已在跑的任务可能仍完成；任一失败最终都会报错

# 分组未来收益评估。字段仅对本模块生效。实现：src/group_return/evaluator.py、grouping.py
group_return:
  start: '2019-01-01'  # 本模块区间起点；必填
  end: '2020-12-31'  # 区间终点，也是未来收益实现截止日；未完成的周期标记并留空
  factor_ids: []  # 从 factor_input 已选因子中再筛；空=全部
  universe_indices:  # 本模块按日历史成员并集；不可空
  - 000906.SH
  - 000852.SH
  grouping:  # 截面分组；不自动补齐区间。实现：src/group_return/grouping.py
    quantile_edges:  # 独立分位区间列表，允许不等宽、重叠、只取尾部。默认十等分 [0,0.1] … [0.9,1]
    - - 0.0
      - 0.1
    - - 0.1
      - 0.2
    - - 0.2
      - 0.3
    - - 0.3
      - 0.4
    - - 0.4
      - 0.5
    - - 0.5
      - 0.6
    - - 0.6
      - 0.7
    - - 0.7
      - 0.8
    - - 0.8
      - 0.9
    - - 0.9
      - 1.0
    min_stocks: 200  # 分组前有效股票截面最少数量（不是每组人数）
    missing_factor_policy: exclude  # exclude：当期因子缺失则剔除该股；error：报错。不用未来价格决定资格
    weighting:  # 组内权重
      method: equal  # equal：等权；field：用正字段归一加权
      field: null  # field 模式必填（如 S_DQ_MV）；equal 时必须为 null
      lag_days: 0  # 加权字段相对参考日的交易日滞后。equal 时必须为 0
  sampling:  # 取截面日程。实现：src/backtest/rebalance.py（与调仓共用星期/假日规则）
    weekday: FRI  # 取截面的星期：MON / TUE / WED / THU / FRI
    every_n_weeks: 1  # 每 N 个自然周取一次截面（原 K）；不是搜索参数。正整数
    anchor_date: '2021-01-01'  # 以该日所在周为相位起点，不随 start/end 改变
    holiday_policy: previous_trading_day  # 指定星期非交易日：previous_trading_day 回退当周上一交易日；skip 跳过该周
  factor_lag_days: 0  # 因子截面相对参考价格日滞后的交易日数。0=同日
  reference_price: close  # 未来收益起终点复权价：close / open
  future_return_days:  # 一次计算的未来交易日周期；正整数、不可重复
  - 5
  - 20
  - 60
  group_return_agg: mean  # 同日同组股票收益合成：mean（可用组内权重）/ median
  time_return_agg: mean  # 多个有效观察日聚合（同一未来周期内）：mean / median
  empty_group_policy: nan  # 某分位区间没有股票：nan 留空 / error 报错
  insufficient_stocks_policy: nan  # 有效股票数不足 min_stocks：nan / error
  missing_price_policy: previous_close  # 必需价格缺失：error 报错；previous_close 用历史参考收盘补齐
  max_stale_days: null  # previous_close 最大陈旧交易日数。null 无额外期限；0 禁止陈旧值。error 策略下通常为 null

# 单位资金简易回测。execution.policy 仅允许 ideal。initial_capital 必须为 1。
# 实现：src/backtest/simple.py、targets.py、events.py
simple_backtest:
  start: '2021-01-01'  # 本模块区间起点；必填
  end: '2021-12-31'  # 区间终点
  factor_ids: []  # 空=使用 factor_input 全部已选因子
  universe_indices:  # 本模块按日历史成员并集
  - 000906.SH
  - 000852.SH
  grouping:  # 与 group_return.grouping 同结构，但只作用于本回测
    quantile_edges:  # 独立分位区间；允许不等宽、重叠、只取尾部
    - - 0.0
      - 0.1
    - - 0.1
      - 0.2
    - - 0.2
      - 0.3
    - - 0.3
      - 0.4
    - - 0.4
      - 0.5
    - - 0.5
      - 0.6
    - - 0.6
      - 0.7
    - - 0.7
      - 0.8
    - - 0.8
      - 0.9
    - - 0.9
      - 1.0
    min_stocks: 200  # 分组前有效股票最少数量
    missing_factor_policy: exclude  # exclude / error
    weighting:
      method: equal  # equal / field
      field: null  # field 模式必填；equal 时 null
      lag_days: 0  # equal 时必须为 0
  rebalance:  # 调仓日程。每个 intervals_weeks 单独跑一遍，不与 future_return_days 绑定
    weekday: FRI  # MON / TUE / WED / THU / FRI
    anchor_date: '2021-01-01'  # 调仓相位锚定周
    holiday_policy: previous_trading_day  # previous_trading_day / skip
    intervals_weeks:  # 调仓间隔（自然周），正整数、不可重复
    - 1
    - 2
    - 4
  factor_lag_days: 0  # 因子相对成交日滞后交易日数
  trade_price: close  # 调仓成交参考价：close / open。日终估值始终用收盘
  initial_entry: first_rebalance  # first_rebalance：首个规则调仓日建仓；start：区间第一交易日额外建仓
  initial_capital: 1.0  # 简易模式必须为 1（单位资金）。实现强制校验
  transaction_cost_rate: 0.0  # 单边费率，范围 [0, 1)。买入、卖出各按实际金额计。0.001=千分之一
  charge_initial_cost: true  # 初始建仓是否收取配置费用
  liquidate_at_end: false  # 是否在末日收盘提交零持仓并计费；tradability 下仍遵守可成交限制
  empty_group_policy: cash  # 空组：cash 变现金 / hold 保持实际持仓 / error
  insufficient_stocks_policy: error  # 总有效股票不足 min_stocks：error / cash / hold
  missing_price_policy: error  # error / previous_close
  max_stale_days: null  # 仅 previous_close 时有意义；null / 非负整数
  curve_frequency: both  # daily：每日收盘估值；rebalance：仅调仓日；both：两者都算。调仓曲线始终保存作核对
  execution:  # 简易仅支持 ideal，后三个 block 在 ideal 下不生效但仍须写出
    policy: ideal  # 简易只能 ideal。ideal 明确忽略停牌/涨跌停限制，但仍需所选价格策略认可的价格
    block_suspended: true  # tradability 时未知状态或停牌拒绝成交（简易忽略）
    block_buy_limit_up: true  # tradability 时涨停不买入
    block_sell_limit_down: true  # tradability 时跌停不卖出

# 模拟账户回测。initial_capital 为正数金额，影响成交金额与持仓明细，不影响净值定义。
# 实现：src/backtest/account.py。execution.policy 可为 ideal 或 tradability。
account_backtest:
  start: '2021-01-01'  # 本模块区间起点；与 simple_backtest / group_return 独立
  end: '2021-12-31'  # 区间终点
  factor_ids: []  # 空=使用 factor_input 全部已选因子
  universe_indices:  # 本模块按日历史成员并集
  - 000906.SH
  - 000852.SH
  grouping:  # 结构同 group_return.grouping，仅作用于本账户回测
    quantile_edges:  # 独立分位区间；允许不等宽、重叠、只取尾部
    - - 0.0
      - 0.1
    - - 0.1
      - 0.2
    - - 0.2
      - 0.3
    - - 0.3
      - 0.4
    - - 0.4
      - 0.5
    - - 0.5
      - 0.6
    - - 0.6
      - 0.7
    - - 0.7
      - 0.8
    - - 0.8
      - 0.9
    - - 0.9
      - 1.0
    min_stocks: 200  # 分组前有效股票最少数量
    missing_factor_policy: exclude  # exclude / error
    weighting:
      method: equal  # equal / field
      field: null  # field 模式必填；equal 时必须 null
      lag_days: 0  # equal 时必须为 0
  rebalance:
    weekday: FRI  # MON / TUE / WED / THU / FRI
    anchor_date: '2021-01-01'  # 调仓相位锚定周
    holiday_policy: previous_trading_day  # previous_trading_day / skip
    intervals_weeks:  # 每个周频单独跑一遍
    - 1
    - 2
    - 4
  factor_lag_days: 0  # 因子相对成交日滞后交易日数
  trade_price: close  # close / open。日终估值始终用收盘
  initial_entry: first_rebalance  # first_rebalance / start
  initial_capital: 1000000  # 账户正数本金；影响金额与持仓，不影响净值
  transaction_cost_rate: 0.0  # 单边费率 [0, 1)；买卖各按实际金额计
  charge_initial_cost: true  # 初始建仓是否收费
  liquidate_at_end: false  # 末日是否提交零持仓并计费
  empty_group_policy: cash  # cash / hold / error
  insufficient_stocks_policy: error  # error / cash / hold
  missing_price_policy: error  # error / previous_close
  max_stale_days: null  # previous_close 最大陈旧交易日；null 无额外期限，0 禁止陈旧
  curve_frequency: both  # daily / rebalance / both。metrics 或绘图要 daily 时会算每日估值
  execution:
    policy: ideal  # ideal 忽略成交限制；tradability 按下列开关拒绝。实现：src/backtest/account.py
    block_suspended: true  # 仅 tradability：停牌或未知状态不成交
    block_buy_limit_up: true  # 仅 tradability：涨停不买入
    block_sell_limit_down: true  # 仅 tradability：跌停不卖出

# 绩效指标。实现：src/backtest/metrics.py。现金本身不计息。
metrics:
  risk_free_rate: 0.0  # Sharpe 年化无风险利率；须 > -1
  return_frequency: daily  # 风险指标取样：daily / rebalance。与回测 curve_frequency、plots.curve_frequency 对齐
  annual_trading_days: 252  # 日频风险年化因子
  annual_weeks: 52  # 调仓频风险年化：除以调仓周数
  include_initial_turnover: true  # 平均/年化/买卖换手是否计入初始建仓
  simple_annual_return: linear  # 简易年化：linear 累加收益线性年化；compound 段收益连乘对照
  account_annual_return: compound  # 账户年化：compound=CAGR；linear=线性
  ic_horizons:  # 若已有同因子 group_return 结果，把这些周期的总体 IC 附到回测指标；不隐式重跑评估
  - 5
  - 20
  - 60

# 出图。还需 run.modules 含 plotting。实现：src/plotting/
plots:
  enabled: true  # 全局开关
  formats:  # png / pdf / svg，至少一种
  - png
  - pdf
  dpi: 160  # 导出分辨率
  width: 13.0  # 图宽（英寸）
  row_height: 3.4  # 每一周期行高（英寸）
  font_family: DejaVu Sans  # Matplotlib 字体；可改为本机已装中文字体
  curve_frequency: daily  # 回测图读取 daily 或 rebalance 曲线；缺少对应频率时提示重新计算
  missing_results: skip  # 对应模块未跑：skip 跳过该图 / error 报错
  note: ''  # 所有图附加说明文字
  legend_columns: 4  # 图例每行列数
  distribution:  # 因子分布图。实现：src/plotting/distribution.py
    enabled: true
    bins: 60  # 直方图箱数
    density: true  # true=密度纵轴；false=频数
    kde: true  # 是否叠加核密度曲线
    clip_quantiles: null  # 可选 [低分位, 高分位] 如 [0.01, 0.99]，仅截取显示样本；null 不截
    max_points: 200000  # 显示最多抽样点数；固定随机种子
  evaluation:  # 图 1：分组收益 + IC。实现：src/plotting/evaluation.py
    enabled: true
    group_panel: left  # 分组柱图在 left / right；另一侧是 IC 序列
    group_colors:  # Q1红、Q10绿；三段深色端点避免中间组在白底上过浅
    - '#A91E22'
    - '#A68B32'
    - '#137A3F'
    ic_color: '#D06A2D'  # 总体 Pearson IC 序列颜色
    rank_ic_color: '#174A73'  # 总体 Spearman RankIC 序列颜色
  simple:  # 图 2：简易回测净值。实现：src/plotting/backtest.py
    enabled: true
    layout: rows  # 固定竖排，各调仓周期独占一行
    group_colors:  # Q1红、Q10绿；中间经过深黄色
    - '#A91E22'
    - '#A68B32'
    - '#137A3F'
    benchmark_color: '#777777'  # 基准固定使用灰色虚线
    summary_quantile: [0.9, 1.0]  # 底部三行摘要对应 q0.1 / Q10
    metric_columns:  # 底部表格指标列及显示顺序，最多建议6项
    - annual_return
    - annual_volatility
    - sharpe
    - max_drawdown
    - annual_turnover
  account:  # 图 3：账户回测净值
    enabled: true
    layout: rows  # rows / columns
    group_colors:
    - '#CB3C3C'
    - '#198754'
    benchmark_color: '#888888'

# 结果落盘。路径：output.root / experiment.name / factor_id。实现：src/pipeline.py、docs/output_reference.md
# 再次运行某计算模块会替换该因子该模块旧结果，其他模块保留。
output:
  root: ../outputs  # 输出根目录
  save_group_members: true  # 保存所选股票、百分位或目标权重明细
  save_target_weights: true  # 保存两种回测的长格式目标表
  save_holdings: true  # 保存账户持仓明细
  save_trades: true  # 保存交易明细；换手汇总始终保存，不受本开关影响
