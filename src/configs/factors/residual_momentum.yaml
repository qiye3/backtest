# 每个文件定义一个固定公式；variants只能覆盖window_defaults中允许的窗口。
# name：因子标识；implementation：计算实现；direction：最终方向。
# data：原始字段需求；params：固定公式参数；history：正式区间前读取的交易日数量。
# smoothing：固定平滑算子与观察单位；window_defaults：计算窗口默认值。
# variants.name：变体名称；variants.windows：仅窗口覆盖。完整标识=name.variant。
# 参数、原始字段和窗口的逐项含义见docs/config_reference.md与docs/factor_catalog.md。
name: residual_momentum
implementation: residual_momentum
direction: 1
data:
  stock_price:
  - S_DQ_ADJCLOSE
  index_price_codes:
  - 000906.SH
params:
  index_code: 000906.SH
  volatility_min_fraction: 0.6666666666666666
history:
  trading_days: 600
smoothing:
  method: mean
  unit: weekly_closes
window_defaults:
  smooth_window: 4
  return_window: 20
  volatility_window: 63
variants:
- name: smooth_4w
  windows: {}
- name: smooth_1w
  windows:
    smooth_window: 1
