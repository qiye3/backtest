# v5 完整示例；路径相对本 YAML。三个 grouping 各自生效，互不继承。
# 未来周期按交易日计数，采样/调仓按锚定自然周；因子平滑只在 factors YAML 中定义。
# close + factor_lag_days: 0 + ideal 是约定的同日收盘理想成交。
# transaction_cost_rate: 0.001 表示买入、卖出各按实际金额收取千分之一。
experiment:
  name: single_factor_v5
run:
  modules:
  - factors
data:
  root: ../data
  calendar_path: null
  benchmark: 000906.SH
  benchmark_return: total_return
factors:
  start: '2019-01-01'
  end: '2021-12-31'
  universe_indices:
  - 000906.SH
  - 000852.SH
  values_dir: ../outputs/factor_values
  configs:
  - factors/consensus_13w_revision.yaml
  - factors/consensus_13w_revision_change_20d.yaml
  - factors/consensus_13w_revision_change_5d.yaml
  - factors/consensus_13w_revision_zscore.yaml
  - factors/growth_np_sue.yaml
  - factors/residual_momentum.yaml
  - factors/residual_momentum_change_20d.yaml
  - factors/residual_momentum_change_5d.yaml
  - factors/residual_momentum_quantile.yaml
  - factors/residual_momentum_zscore.yaml
  - factors/roe_history_zscore.yaml
  - factors/roe_level.yaml
  - factors/roe_qoq_diff.yaml
  - factors/roe_yoy_diff.yaml
parallel:
  enabled: true
  backend: process
  workers: 4
  on_error: continue
metrics:
  risk_free_rate: 0.0
  return_frequency: daily
  annual_trading_days: 252
  annual_weeks: 52
  include_initial_turnover: true
  simple_annual_return: linear
  account_annual_return: compound
  ic_horizons:
  - 5
  - 20
  - 60
plots:
  enabled: true
  formats:
  - png
  - pdf
  dpi: 160
  width: 13.0
  row_height: 3.4
  font_family: DejaVu Sans
  curve_frequency: daily
  missing_results: skip
  note: ''
  legend_columns: 4
  distribution:
    enabled: true
    bins: 60
    density: true
    kde: true
    clip_quantiles: null
    max_points: 200000
  evaluation:
    enabled: true
    group_panel: left
    group_colors:
    - '#A91E22'
    - '#A68B32'
    - '#137A3F'
    ic_color: '#D06A2D'
    rank_ic_color: '#174A73'
  simple:
    enabled: true
    layout: rows
    group_colors:
    - '#A91E22'
    - '#A68B32'
    - '#137A3F'
    benchmark_color: '#777777'
    summary_quantile:
    - 0.9
    - 1.0
    metric_columns:
    - annual_return
    - annual_volatility
    - sharpe
    - max_drawdown
    - annual_turnover
  account:
    enabled: true
    layout: rows
    group_colors:
    - '#CB3C3C'
    - '#198754'
    benchmark_color: '#888888'
output:
  root: ../outputs
  save_group_members: true
  save_target_weights: true
  save_holdings: true
  save_trades: true
