# v5 完整示例；路径相对本 YAML。三个 grouping 各自生效，互不继承。
# 未来周期按交易日计数，采样/调仓按锚定自然周；因子平滑只在 factors YAML 中定义。
# close + factor_lag_days: 0 + ideal 是约定的同日收盘理想成交。
# transaction_cost_rate: 0.001 表示买入、卖出各按实际金额收取千分之一。
experiment:
  name: single_factor_v5
run:
  modules:
  - group_return
data:
  root: ../data
  calendar_path: null
  benchmark: 000906.SH
  benchmark_return: total_return
factor_input:
  source: generated
  values_dir: ../outputs/factor_values
  ids:
  - roe_level.smooth_1d
  - consensus_13w_revision.smooth_1d
  files: []
  layout: wide
  date_column: date
  alignment: exact
parallel:
  enabled: true
  backend: process
  workers: 4
  on_error: continue
group_return:
  start: '2019-01-01'
  end: '2020-12-31'
  factor_ids: []
  universe_indices:
  - 000906.SH
  - 000852.SH
  grouping:
    quantile_edges:
    - - 0.0
      - 0.1
    - - 0.1
      - 0.2
    - - 0.2
      - 0.3
    - - 0.3
      - 0.4
    - - 0.4
      - 0.5
    - - 0.5
      - 0.6
    - - 0.6
      - 0.7
    - - 0.7
      - 0.8
    - - 0.8
      - 0.9
    - - 0.9
      - 1.0
    min_stocks: 200
    missing_factor_policy: exclude
    weighting:
      method: equal
      field: null
      lag_days: 0
  sampling:
    weekday: FRI
    every_n_weeks: 1
    anchor_date: '2021-01-01'
    holiday_policy: previous_trading_day
  factor_lag_days: 0
  reference_price: close
  future_return_days:
  - 5
  - 20
  - 60
  group_return_agg: mean
  time_return_agg: mean
  empty_group_policy: nan
  insufficient_stocks_policy: nan
  missing_price_policy: previous_close
  max_stale_days: null
metrics:
  risk_free_rate: 0.0
  return_frequency: daily
  annual_trading_days: 252
  annual_weeks: 52
  include_initial_turnover: true
  simple_annual_return: linear
  account_annual_return: compound
  ic_horizons:
  - 5
  - 20
  - 60
plots:
  enabled: true
  formats:
  - png
  - pdf
  dpi: 160
  width: 13.0
  row_height: 3.4
  font_family: DejaVu Sans
  curve_frequency: daily
  missing_results: skip
  note: ''
  legend_columns: 4
  distribution:
    enabled: true
    bins: 60
    density: true
    kde: true
    clip_quantiles: null
    max_points: 200000
  evaluation:
    enabled: true
    group_panel: left
    group_colors:
    - '#A91E22'
    - '#A68B32'
    - '#137A3F'
    ic_color: '#D06A2D'
    rank_ic_color: '#174A73'
  simple:
    enabled: true
    layout: rows
    group_colors:
    - '#A91E22'
    - '#A68B32'
    - '#137A3F'
    benchmark_color: '#777777'
    summary_quantile:
    - 0.9
    - 1.0
    metric_columns:
    - annual_return
    - annual_volatility
    - sharpe
    - max_drawdown
    - annual_turnover
  account:
    enabled: true
    layout: rows
    group_colors:
    - '#CB3C3C'
    - '#198754'
    benchmark_color: '#888888'
output:
  root: ../outputs
  save_group_members: true
  save_target_weights: true
  save_holdings: true
  save_trades: true
