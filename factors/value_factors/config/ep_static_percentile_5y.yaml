name: ep_static_percentile_5y
implementation:
  module: factors.value_factors.code.ValueFactor
  class: ValueFactor
params:
  base_factor: ep_static
  operator: percentile_5y
  rolling_mean_window: 1
  min_periods: 1
  neutralize: false
  winsorize:
    min_quantile: 0.0
    max_quantile: 1.0
  reverse: false
postprocess:
  cross_section:
    method: rank
variants:
- suffix: raw
  neutralization:
    method: none
- suffix: industry_neutral
  neutralization:
    method: industry_demean
    source: industry_history
    field: ind_class_code
