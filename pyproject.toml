[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-backtest"
version = "0.1.0"
description = "Config-driven factor evaluation and backtesting"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["examples*", "factors*", "src*", "strategies*"]

[tool.setuptools.package-data]
"strategies.yfd_growth100_factors" = [
  "*.yaml",
  "factor_configs/*.yaml",
  "strategy_configs/*.yaml",
]
"strategies.roadshow_indices" = [
  "*.yaml",
  "factor_configs/*.yaml",
  "strategy_configs/*.yaml",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
