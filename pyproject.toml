[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-backtest"
version = "0.2.0"
description = "Config-driven factor evaluation and backtesting"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "py7zr>=0.22",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["examples*", "factors*", "src*", "strategies*"]

[tool.setuptools.package-data]
"src.intraday" = ["data_corrections.json"]
"factors.growth_factors" = ["config/*.yaml", "*.yaml"]
"factors.quality_factors" = ["config/*.yaml", "*.yaml"]
"factors.value_factors" = ["config/*.yaml", "*.yaml"]
"factors.first_batch_factors" = ["config/*.yaml", "*.yaml"]
"factors.second_batch_factors" = ["config/*.yaml", "*.yaml"]
"strategies.yfd_growth100_factors" = [
  "*.yaml",
  "factor_configs/*.yaml",
  "strategy_configs/*.yaml",
]
"strategies.roadshow_indices" = [
  "*.yaml",
  "factor_configs/*.yaml",
  "strategy_configs/*.yaml",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
